services:
  - type: web
    name: prescriber-risk-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_API_KEY
        sync: false

  - type: web
    name: fraud-detection-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: BASE_DIR
        value: /app
      - key: MODEL_DATA_DIR
        value: /app/Data/Model_Data
      - key: SKLEARN_MODEL_PATH
        value: /app/Models/gbt_sklearn.pkl
      - key: API_BASE_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: APP_API_KEY
        sync: false

